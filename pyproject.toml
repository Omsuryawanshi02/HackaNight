[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "siteaudit"
version = "0.1.0"
description = "Site Operations Audit Platform - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "Pillow>=10.0.0",
    "piexif>=2.3.0",
    "exifread>=3.0.0",
    "imagehash>=4.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "rapidfuzz>=3.5.0",
    "python-multipart>=0.0.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx[http2]>=0.27.0",
    "ruff>=0.4.0",
]

[project.optional-extras]
[project.scripts]
siteaudit = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["tests/**/test_*.py", "tests/**/*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"